<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hasbi FPS Optimizer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #08090d;
    color: white;
}

.container {
    max-width: 480px;
    margin: auto;
    padding: 18px;
}

/* HEADER */
.header {
    text-align: center;
    padding: 15px 0 20px;
}

.logo {
    font-size: 38px;
}

.title {
    font-size: 25px;
    font-weight: bold;
    margin-top: 5px;
}

.subtitle {
    color: #999;
    font-size: 13px;
    margin-top: 5px;
}

/* CARD */
.card {
    background: #14161d;
    border: 1px solid #252832;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
}

.card-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* FPS */
.fps-number {
    text-align: center;
    font-size: 58px;
    font-weight: bold;
    margin: 10px 0;
}

.fps-label {
    text-align: center;
    color: #999;
    font-size: 13px;
}

/* FPS BUTTON */
.fps-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 18px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 8px;
    background: #252832;
    color: white;
    font-size: 14px;
    font-weight: bold;
}

button:active {
    transform: scale(.96);
}

button.active {
    background: #1677ff;
}

/* OPTIMIZE */
.optimize {
    width: 100%;
    background: #1677ff;
    padding: 16px;
    font-size: 17px;
}

.optimize.active {
    background: #19a463;
}

/* MODES */
.mode {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1c1f27;
    padding: 13px;
    border-radius: 12px;
    margin-bottom: 9px;
}

.mode-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.icon {
    font-size: 22px;
}

.mode-name {
    font-weight: bold;
}

.mode-desc {
    color: #888;
    font-size: 11px;
    margin-top: 3px;
}

/* SWITCH */
.switch {
    position: relative;
    width: 48px;
    height: 27px;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #333;
    border-radius: 30px;
}

.slider:before {
    content: "";
    position: absolute;
    width: 21px;
    height: 21px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: .2s;
}

input:checked + .slider {
    background: #1677ff;
}

input:checked + .slider:before {
    transform: translateX(21px);
}

/* STATUS */
.status {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #252832;
}

.status:last-child {
    border-bottom: none;
}

.good {
    color: #32d583;
}

.blue {
    color: #4da3ff;
}

.gray {
    color: #888;
}

/* FOOTER */
.footer {
    text-align: center;
    color: #666;
    font-size: 11px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">🎮</div>

        <div class="title">
            HASBI FPS OPTIMIZER
        </div>

        <div class="subtitle">
            Smooth Gaming Dashboard
        </div>
    </div>


    <!-- FPS CARD -->
    <div class="card">

        <div class="card-title">
            FPS TARGET
        </div>

        <div class="fps-number" id="fpsNumber">
            60
        </div>

        <div class="fps-label">
            FPS target
        </div>

        <div class="fps-buttons">

            <button id="fps60"
                    onclick="setFPS(60)">
                60 FPS
            </button>

            <button id="fps90"
                    onclick="setFPS(90)">
                90 FPS
            </button>

            <button id="fps120"
                    onclick="setFPS(120)">
                120 FPS
            </button>

        </div>

    </div>


    <!-- OPTIMIZE -->
    <div class="card">

        <div class="card-title">
            PERFORMANCE
        </div>

        <button
            class="optimize"
            id="optimizeButton"
            onclick="optimize()">

            ⚡ OPTIMIZE NOW

        </button>

    </div>


    <!-- MODES -->
    <div class="card">

        <div class="card-title">
            GAMING MODES
        </div>


        <!-- SMOOTH -->
        <div class="mode">

            <div class="mode-left">

                <div class="icon">
                    🚀
                </div>

                <div>

                    <div class="mode-name">
                        Smooth Mode
                    </div>

                    <div class="mode-desc">
                        Prioritas kestabilan
                    </div>

                </div>

            </div>


            <label class="switch">

                <input
                    type="checkbox"
                    id="smooth"
                    onchange="changeMode('Smooth Mode', this.checked)">

                <span class="slider"></span>

            </label>

        </div>


        <!-- GAMING -->
        <div class="mode">

            <div class="mode-left">

                <div class="icon">
                    🎮
                </div>

                <div>

                    <div class="mode-name">
                        Gaming Mode
                    </div>

                    <div class="mode-desc">
                        Mode bermain game
                    </div>

                </div>

            </div>


            <label class="switch">

                <input
                    type="checkbox"
                    id="gaming"
                    onchange="changeMode('Gaming Mode', this.checked)">

                <span class="slider"></span>

            </label>

        </div>


        <!-- PERFORMANCE -->
        <div class="mode">

            <div class="mode-left">

                <div class="icon">
                    ⚡
                </div>

                <div>

                    <div class="mode-name">
                        Performance Mode
                    </div>

                    <div class="mode-desc">
                        Prioritas performa
                    </div>

                </div>

            </div>


            <label class="switch">

                <input
                    type="checkbox"
                    id="performance"
                    onchange="changeMode('Performance Mode', this.checked)">

                <span class="slider"></span>

            </label>

        </div>

    </div>


    <!-- STATUS -->
    <div class="card">

        <div class="card-title">
            SYSTEM STATUS
        </div>


        <div class="status">

            <span>
                Optimizer
            </span>

            <span
                id="optimizerStatus"
                class="gray">

                Ready

            </span>

        </div>


        <div class="status">

            <span>
                FPS Target
            </span>

            <span
                id="statusFPS"
                class="blue">

                60 FPS

            </span>

        </div>


        <div class="status">

            <span>
                Mode
            </span>

            <span
                id="modeStatus"
                class="gray">

                Normal

            </span>

        </div>

    </div>


    <div class="footer">

        Hasbi FPS Optimizer • Web Edition

    </div>

</div>


<script>

/* =========================
   FPS
========================= */

let currentFPS = 60;


function setFPS(fps) {

    currentFPS = fps;


    document.getElementById("fpsNumber")
        .innerText = fps;


    document.getElementById("statusFPS")
        .innerText = fps + " FPS";


    document
        .querySelectorAll(".fps-buttons button")
        .forEach(button => {

            button.classList.remove("active");

        });


    document
        .getElementById("fps" + fps)
        .classList.add("active");


    document.getElementById("optimizerStatus")
        .innerText = "FPS target set";


    document.getElementById("optimizerStatus")
        .className = "blue";

}


/* =========================
   OPTIMIZE
========================= */

function optimize() {

    const button =
        document.getElementById("optimizeButton");


    button.innerText =
        "⚡ OPTIMIZING...";


    document.getElementById("optimizerStatus")
        .innerText = "Optimizing";


    document.getElementById("optimizerStatus")
        .className = "blue";


    setTimeout(function() {

        button.innerText =
            "✓ OPTIMIZED";


        button.classList.add("active");


        document.getElementById("optimizerStatus")
            .innerText = "Optimized";


        document.getElementById("optimizerStatus")
            .className = "good";


    }, 1500);

}


/* =========================
   GAMING MODE
========================= */

function changeMode(name, enabled) {

    const modeStatus =
        document.getElementById("modeStatus");


    if (enabled) {

        modeStatus.innerText =
            name;

        modeStatus.className =
            "good";

    } else {

        modeStatus.innerText =
            "Normal";

        modeStatus.className =
            "gray";

    }

}

</script>

</body>
</html>
